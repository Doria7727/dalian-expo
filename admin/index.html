<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>内容管理后台 · 大连工博会</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f7f9; color: #222; }
    .wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; box-sizing: border-box; }
    .spinner { width: 56px; height: 56px; border: 4px solid #e0e3eb; border-top-color: #6c5ce7; border-radius: 50%; animation: spin 0.9s linear infinite; margin-bottom: 1.4rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .title { font-size: 1.15rem; color: #444; margin-bottom: 0.4rem; }
    .sub { font-size: 0.9rem; color: #888; max-width: 520px; text-align: center; line-height: 1.55; }
    .sub code { background: #ececf0; padding: 1px 6px; border-radius: 3px; font-size: 0.88em; color: #555; }
    .err { display: none; margin-top: 1.5rem; padding: 1rem 1.2rem; background: #fff3f3; border: 1px solid #ffd0d0; border-radius: 8px; color: #b00; font-size: 0.9rem; max-width: 620px; text-align: left; }
    .err.show { display: block; }
    .err b { color: #900; }
    .retry { margin-top: 0.8rem; padding: 6px 14px; background: #6c5ce7; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .retry:hover { background: #5b4cd1; }
  </style>
  <!-- 关键：使用 manual init 模式 + inline 配置，不依赖 fetch config.yml -->
  <script>
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>
  <div class="wrap" id="loading">
    <div class="spinner"></div>
    <div class="title">正在加载内容管理后台……</div>
    <div class="sub">
      首次加载需要下载后台脚本（约 5 MB），请耐心等待。<br>
      登录后会跳转到 GitHub 授权，请用 <strong>Doria7727</strong> 账号登录。
    </div>
    <div class="err" id="errBox">
      <b>加载失败</b><br>
      所有 CDN 源都不可用。<br>
      请按 <kbd>F12</kbd> 打开控制台，截图发给我。
    </div>
  </div>

  <!-- 1. 内联配置（不依赖 fetch） -->
  <script src="./config.js"></script>

  <!-- 2. Decap CMS：本地 vendor 优先，CDN 三源 fallback -->
  <script>
    (function () {
      var sources = [
        '../assets/vendor/decap-cms.js',
        'https://cdn.jsdelivr.net/npm/decap-cms@3.7.5/dist/decap-cms.js',
        'https://unpkg.com/decap-cms@3.7.5/dist/decap-cms.js'
      ];
      var idx = 0;
      function tryNext() {
        if (idx >= sources.length) {
          showError();
          return;
        }
        var src = sources[idx++];
        console.log('[' + idx + '/' + sources.length + '] 尝试加载 Decap CMS:', src);
        var s = document.createElement('script');
        var settled = false;
        var timer = setTimeout(function () {
          if (settled) return;
          settled = true;
          console.warn('源超时（>30s）:', src);
          if (s.parentNode) s.parentNode.removeChild(s);
          tryNext();
        }, 30000);
        s.onload = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          console.log('Decap CMS 加载成功:', src);
          doInit();
        };
        s.onerror = function () {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          console.warn('Decap CMS 源失败:', src);
          tryNext();
        };
        document.head.appendChild(s);
      }
      function doInit() {
        if (!window.CMS) { console.error('CMS 未挂载到 window'); showError(); return; }
        try {
          window.CMS.init({
            config: window.CMS_CONFIG
          });
          console.log('Decap CMS 初始化完成');
        } catch (e) {
          console.error('Decap CMS 初始化失败:', e);
          showError();
        }
      }
      function showError() {
        document.querySelector('.spinner').style.display = 'none';
        document.querySelector('.title').style.display = 'none';
        document.querySelector('.sub').style.display = 'none';
        var e = document.getElementById('errBox');
        e.classList.add('show');
        var btn = document.createElement('button');
        btn.className = 'retry';
        btn.textContent = '重新加载';
        btn.onclick = function(){ location.reload(); };
        e.appendChild(btn);
      }
      tryNext();
    })();
  </script>
</body>
</html>
